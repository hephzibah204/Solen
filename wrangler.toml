name = "solen-api"
main = "src/api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare Workers AI Binding ──────────────────────────────────────────
[ai]
binding = "AI"

# ── Cloudflare D1 Database Binding ─────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "solen-db"
database_id = "ec54b1b6-9de2-48ee-aecc-7570329a551c"
migrations_dir = "drizzle"

# ── KV Namespace for sessions/cache ───────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "a5bbb8831b16421dabb803a8b4ef213f"
preview_id = "7153be5e3c0845af972f1128d1ccf955"

# ── Environment Variables ──────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://getsolen.com"
SITE_NAME = "Solen"

# ── Local Dev Overrides ────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"


