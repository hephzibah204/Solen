<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline — Solen</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07070f">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070f;
      --surface: #0d0d1e;
      --accent: #b8956a;
      --text: #f2ede8;
      --muted: rgba(242, 237, 232, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 0%, rgba(184,149,106,0.1) 0%, transparent 70%);
    }
    .card {
      max-width: 380px;
      width: 100%;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      color: var(--accent);
      margin-bottom: 48px;
      letter-spacing: 0.05em;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(184,149,106,0.1);
      border: 1px solid rgba(184,149,106,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 32px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 16px;
      color: var(--text);
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #1a1008;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .tip {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Solen</div>
    <div class="icon">🌿</div>
    <h1>You're offline</h1>
    <p>Your coach is waiting for you, but it looks like you've lost your connection. Take a breath — we'll be here when you're back online.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="tip">💡 Tip: Install Solen as an app to access your daily rituals even with a spotty connection.</div>
  </div>
</body>
</html>
